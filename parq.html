.hscroll>*{flex:none}
.lock{overflow:hidden!important}
#orbov{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--stick);border-radius:20px}
.orbsvg{width:min(58%,260px);height:auto;animation:orbf 2.2s ease-in-out infinite}
@keyframes orbf{0%,100%{transform:translateY(3px);filter:drop-shadow(0 0 12px #8a4dff) drop-shadow(0 0 26px #c27bff55)}50%{transform:translateY(-6px);filter:drop-shadow(0 0 24px #b36bff) drop-shadow(0 0 50px #ff6bd5aa)}}
.mist{transform-origin:100px 92px;animation:mspin 7s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
.tws{animation:tw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.orbt{font-weight:700;color:var(--ink);text-align:center;animation:tw 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.orbsvg,.mist,.tws,.orbt{animation:none}}
.orbw{text-align:center;padding:14px 0 4px}
.orb{display:inline-block;font-size:110px;line-height:1;animation:orb 1.6s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(.92) translateY(2px);filter:drop-shadow(0 0 10px #8a4dff) drop-shadow(0 0 22px #c27bff66)}50%{transform:scale(1.08) translateY(-4px);filter:drop-shadow(0 0 22px #b36bff) drop-shadow(0 0 46px #ff6bd5aa)}}
.spk{color:#c9aaff;letter-spacing:.5em;font-size:.9em;animation:tw 1.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orb,.spk{animation:none}}
.rng2{flex:1;touch-action:none;user-select:none;cursor:pointer;padding:10px 4px 0;outline:none}
.rtrack{position:relative;height:20px;border-radius:99px;background:var(--cdb);margin:14px 26px 6px}
.rfill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p)*100%);border-radius:99px;background:var(--grad)}
.rthumb{position:absolute;top:50%;left:calc(var(--p)*100%);width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--grad);border:4px solid #fff;box-shadow:0 2px 10px #0006}
.rng2.snap .rfill{transition:width .18s}.rng2.snap .rthumb{transition:left .18s}
.rticks{display:flex;justify-content:space-between;margin:0 26px;transform:translateY(8px);font-weight:700;color:var(--mut);font-size:.8em}
.rticks span{width:1em;text-align:center;margin:0 -.5em}
.sl-stats{display:grid;grid-template-columns:1fr;gap:4px;max-width:290px;margin:10px auto 0;font-size:.8em;font-weight:600;text-align:left}
.sl-stats div{display:flex;justify-content:space-between;gap:6px;align-items:center}
.sl-stats span{opacity:.85;white-space:nowrap}
.sl-stats i{font-style:normal;color:#ffd24a;letter-spacing:0;white-space:nowrap}
.sl-stats u{text-decoration:none;opacity:.28}
.rngv{font-size:1.8em;font-weight:800;min-width:1.5em;text-align:center}
.go{width:100%;font-size:1.3em;padding:16px;margin-top:16px;font-weight:800;letter-spacing:.03em}
.slip{position:relative;margin-top:14px;padding:22px 18px 18px;border-radius:24px;background:linear-gradient(170deg,#9c1c24,#c2342f 45%,#8a1220);color:#fff4d6;text-align:center;border:3px solid #f2c75c;box-shadow:inset 0 0 0 6px #7e1019,inset 0 0 0 8px #f2c75c88,0 10px 26px #0005;overflow:hidden}
.sl-top{letter-spacing:.35em;color:#f2c75c;font-size:.7em;opacity:.95}
.sl-h{margin-top:6px;font-size:1.55em;font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#f6d675,#fff6c8,#f6d675,#d9a92b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sl-h{animation:none}}
.sl-no{font-size:.8em;color:#f2c75c;margin-top:2px}
.sl-luck{margin:12px 0 4px;font-weight:700}
.sl-luck b{display:block;color:#ffe28a;font-size:1.35em;text-shadow:0 0 12px #ffd24a88}
.sl-st{color:#ffd24a;letter-spacing:.15em}
.sl-sec{margin-top:16px;font-size:.68em;letter-spacing:.25em;color:#f2c75c;font-weight:800}
.sl-box{background:#fff7e0;color:#5a1a14;border-radius:16px;padding:6px 12px;margin-top:8px;text-align:left;box-shadow:inset 0 0 0 2px #f2c75c}
.sl-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #c9a24a99;cursor:pointer}
.sl-row:last-child{border:0}
.sl-row small{opacity:.7}
.sl-n{flex:none;width:2em;height:2em;border-radius:50%;background:#b3262b;color:#ffe28a;font-weight:800;display:grid;place-items:center}
.sl-txt{font-size:.95em;line-height:1.6;margin-top:6px;padding:0 4px}
.sl-bl{font-style:italic;color:#ffe9a6}
.sl-done{margin-top:14px;font-weight:900;color:#ffe28a;font-size:1.15em}
.sl-tags{margin-top:12px;font-size:.62em;opacity:.8}
.slipl{cursor:pointer}
.rc-d{font-size:.85em;opacity:.75;margin:-2px 0 4px 1.8em}
.dotm{display:inline-block;width:.9em;height:.9em;border-radius:50%;border:2px solid #3b3322;vertical-align:-.1em;margin:0 .35em}
.rwrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.rwrow input{width:90px;text-align:center}
.rwrow input.oe{width:70px}
.rwrow input.ot{flex:1;width:auto;min-width:0;text-align:left}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--toast);color:var(--toast-ink);font-size:14px;padding:8px 14px;border-radius:99px;max-width:90vw}
.btn:disabled{opacity:.4;cursor:default}
.mcm{margin:10px 0 4px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px}
.mcr{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.mcr input[type=checkbox]{width:20px;height:20px;flex:none}
.mcr .mce{width:52px;text-align:center;flex:none}
.mcr .mcn{flex:1;min-width:0}
.mchid{opacity:.45}
#ss h3{margin:4px 0 8px}
.sshead{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}
.sshead h3{margin:0;flex:1;font-size:1.15em;letter-spacing:.02em}
.sshead select{max-width:55%}
.ssprev{margin:6px 0 10px;border-radius:16px;overflow:hidden;line-height:0;border:1px solid var(--line)}
.ssprev canvas{width:100%;height:auto;display:block}
.ssprev.pw{background:linear-gradient(145deg,#3b4254,#1b1e29)}
.ssprev.pb{background:linear-gradient(145deg,#f7f3ea,#dbe6ef)}
.ssprev.pc{background:linear-gradient(145deg,#1b2133,#2a1d3b)}
.sslbl{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:12px 0 6px}
.ssseg{display:flex;gap:6px}
.ssseg .chip{flex:1;text-align:center}
.sstog{display:flex;flex-wrap:wrap;gap:6px}
.sstog .chip{padding:6px 12px}
.ssacts{display:flex;gap:8px;margin:12px 0 4px}
.ssacts .btn{flex:1;padding:12px;font-weight:700}
.csmode{display:flex;gap:8px;margin:0 0 12px}
.csmode .chip{flex:1;text-align:center;padding:9px 12px;font-weight:700}
.cshow ol{margin:4px 0 0;padding-left:18px}
.cshow{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:.88em;line-height:1.5;color:var(--mut)}
.cshow li{margin:2px 0}
.cshow b{color:var(--ink)}

.csbig{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.csbig b{font-family:"WildYouth",inherit;font-size:3.3em;line-height:1;font-weight:400;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.csbig span{font-weight:700;opacity:.75}
.csbig .chip{margin-left:auto;align-self:center;font-size:1.35em;padding:2px 14px;line-height:1.5}
.m.dim.csd{opacity:.34}
.m.cus b{filter:none}
.m.cus b{box-shadow:0 0 0 3px #22a45a,0 1px 4px #0006}
.ssacts .btn.pri{background:var(--grad);color:var(--on-ink);border-color:transparent}
.vwc{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.vwc h4{margin:0 0 8px;font-size:15px}
.vwc .vwk{display:flex;gap:10px}
.vwc .vwk>div{flex:1;text-align:center}
.vwc .vwk b{display:block;font-size:26px;line-height:1.1}
.vwc .vwk span{font-size:12px;color:var(--mut)}
.vwc .vwd{display:grid;grid-template-columns:62px 1fr 64px;gap:6px;align-items:center;font-size:12px;margin-top:5px;color:var(--mut)}
.vwc .vwd i{display:block;height:8px;border-radius:4px;background:var(--grad);min-width:2px}
.vwc .vwn{font-size:11px;color:var(--mut);margin:8px 0 0;line-height:1.35}
.clrbox{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.clrbox .btn{border-color:#e5484d;color:#e5484d}
#clrBk{position:fixed;inset:0;z-index:58;background:#0007}
#clrSheet{z-index:59;left:0;right:0;max-width:none;margin:0;bottom:0;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:70vh}
#clrSheet .ct{font-size:20px;font-weight:800;margin:0 0 6px}
#clrSheet p{margin:0 0 6px;font-size:15px;line-height:1.4}
#clrSheet .acts{display:flex;gap:10px;margin-top:16px}
#clrSheet .btn{flex:1;font-size:17px;padding:13px 10px}
#clrSheet .btn.danger{background:#e5484d;color:#fff;border-color:transparent}
.rate{margin:12px 0 6px}
.rate-h{display:flex;align-items:center;gap:10px;font-size:15px}
.rate-h>span:first-child{flex:1}
.rate-st{position:relative;display:inline-block;font-size:24px;line-height:1;letter-spacing:2px;color:var(--cdb)}
.rate-st i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;font-style:normal;color:#f5b301}
.rate-v{min-width:2.4em;text-align:right;font-size:22px;font-weight:800}
.rate-hit{touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;padding:40px 0;outline:none}
.rate-bar{position:relative;height:30px;border-radius:99px;background:var(--cdb);margin:0 24px}
.rate-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--grad)}
.rate-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:1.9em;height:1.9em;border-radius:50%;background:#fff;display:grid;place-items:center;line-height:1;color:#f5b301;pointer-events:none;box-shadow:0 2px 8px #0007,0 0 0 2px var(--cdb)}
.rate-bar.snap .rate-fill{transition:width .16s ease}
.rate-bar.snap .rate-thumb{transition:left .16s ease,font-size .16s ease}
.sscol{display:flex;gap:8px;align-items:center;margin:2px 0 8px}
.chx-h{display:none!important}
.oldsend{display:flex;align-items:center;gap:8px;margin:8px 2px 0;font-size:14px;color:var(--mut);cursor:pointer}
.oldsend input{width:18px;height:18px;flex:none}
.tsw{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);cursor:pointer;flex:none}
.row label.tsw{display:inline-flex;flex-direction:row;flex:none;min-width:0;gap:10px;font-size:14px;color:var(--ink)}
.tsw input{position:absolute;opacity:0;width:0;height:0}
.tsw i{position:relative;width:54px;height:32px;border-radius:16px;background:var(--card);border:1px solid var(--line);flex:none;transition:background .15s}
.tsw i::after{content:"";position:absolute;left:4px;top:3px;width:24px;height:24px;border-radius:50%;background:#222;transition:transform .15s,background .15s}
.tsw input:checked+i{background:#2ea43a;border-color:#2ea43a}
.tsw input:checked+i::after{background:#fff;transform:translateX(22px)}
.tsw input:disabled+i{opacity:.7}
.tsw input:focus-visible+i{outline:2px solid #ff4d8d;outline-offset:2px}
.chx-dim{opacity:.4}
#cedrow{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
body.cx-admin #cedrow{display:flex}
#cedrow .btn.on{background:var(--grad);color:var(--on-ink);border-color:transparent}
#cedrow .mut{font-size:12px;flex:1 1 100%}
body.cx-edit #side .chips,body.cx-edit #side .hscroll,body.cx-edit #side .sscol,body.cx-edit #ctabs{padding-top:26px;gap:30px 26px}
body.cx-edit #side .hscroll{padding-left:24px;padding-right:24px}
.cxh,.cxx{position:absolute;top:-22px;min-width:40px;height:40px;box-sizing:border-box;border-radius:20px;display:grid;place-items:center;font-size:22px;font-weight:800;line-height:1;color:#fff;z-index:6;box-shadow:0 2px 6px #0008;border:3px solid #fff;padding:0 4px;font-family:system-ui,sans-serif;font-style:normal;letter-spacing:0;text-indent:0;overflow:visible;white-space:nowrap}
.cxh{left:-18px;background:#3b3b46;touch-action:none;cursor:grab}
.cxx{right:-18px;background:#e5484d;cursor:pointer}
.cxx.rs{background:#22a45a}
.cxx.cf{background:#b4121a;padding:0 12px;font-size:20px}
.cxdrag{opacity:.55;transform:scale(1.08);z-index:20!important;outline:2px dashed #ff3d7f;outline-offset:2px}
body.cx-edit #ctabs .chip,body.cx-edit .chip[data-cx],body.cx-edit .dot[data-cx]{position:relative}
.sscol .chip{font-size:1.35em;padding:2px 14px;line-height:1.5}
.sscol .chip.tr{margin-left:auto;font-size:1em;padding:6px 12px}
.bdgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 6px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border:2px solid transparent;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.bdg.on{border-color:#f5b301}
.bdg.locked{opacity:.5;cursor:default}
.bdg.locked .bm{filter:grayscale(1)}
.bdg .bm{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;border:4px solid #fff;box-shadow:0 0 0 2px var(--bc),0 2px 6px #0005;background:var(--bc)}
.bdg .bm svg{width:30px;height:30px}
.bdg b{font-size:13px}
.bdg span{font-size:11px;color:var(--mut);line-height:1.25}
.sstags{display:flex;flex-wrap:wrap;gap:6px}
.sstags span{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:600;background:var(--card)}
.sstags b{margin-left:6px;opacity:.7}
.ph{display:none!important}
#hamb{position:fixed;right:10px;top:calc(66px + env(safe-area-inset-top,0px));z-index:22;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panelbg);color:var(--ink);font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px #0004;cursor:pointer;padding:0}

#sheet .btn{font-size:16px;padding:10px 14px}
#sheet .qb{font-size:15px;padding:11px 4px}
#sheet .qe{font-size:22px}
#sheet .big{font-size:22px}
[hidden]{display:none!important}
#zn,#zc,#rz,#bImg{display:none!important}
